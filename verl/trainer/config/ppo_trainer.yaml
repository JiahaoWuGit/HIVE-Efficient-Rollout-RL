# Main-study defaults; scripts/train.py supplies model profiles and run-specific paths.
data:
  tokenizer: null
  train_files:
  - data/dapo_math/train.parquet
  - data/lighteval-math/train.parquet
  val_files:
  - data/math500/test.parquet
  - data/aime2024/test.parquet
  - data/amc/test.parquet
  - data/gaokao/test.parquet
  - data/minervamath/test.parquet
  - data/olympiadbench/test.parquet
  prompt_key: prompt
  max_prompt_length: 1536
  max_response_length: 2560
  train_batch_size: 32
  val_batch_size: 8
  return_raw_input_ids: false
  return_raw_chat: false
  shuffle: true
  filter_overlong_prompts: false
  truncation: left
  image_key: images
  seed: 42
  real_train_batch_size: 256
  sampling_batch_size: 384
  history_fusion_weight: 0.9
  history_reward_floor: 0.01
  p_easy: 0.5
  p_hard: 0.5
  target_zero_variance: 0.25
  exploration_step: 0.01
  min_p: 0.05
  max_p: 0.95
  entropy_keep_ratio: 0.5
  entropy_start_ratio: 0.0
  resample_minimum: 64
  resample_safety_factor: 1.25
actor_rollout_ref:
  hybrid_engine: true
  model:
    path: Qwen/Qwen2.5-Math-1.5B
    external_lib: null
    override_config: {}
    enable_gradient_checkpointing: true
    use_remove_padding: true
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 64
    ppo_micro_batch_size: null
    ppo_micro_batch_size_per_gpu: 8
    use_dynamic_bsz: false
    ppo_max_token_len_per_gpu: 16384
    grad_clip: 1.0
    clip_ratio: 0.2
    entropy_coeff: 0.001
    use_kl_loss: false
    use_torch_compile: true
    ppo_epochs: 1
    shuffle: false
    ulysses_sequence_parallel_size: 1
    optim:
      lr: 1.0e-06
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.0
      min_lr_ratio: null
      warmup_style: constant
      total_training_steps: -1
      betas:
      - 0.9
      - 0.999
      weight_decay: 0.01
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: false
      optimizer_offload: false
      fsdp_size: -1
  rollout:
    name: vllm
    temperature: 1.0
    top_k: -1
    top_p: 1
    prompt_length: ${data.max_prompt_length}
    response_length: ${data.max_response_length}
    dtype: bfloat16
    gpu_memory_utilization: 0.6
    ignore_eos: false
    enforce_eager: true
    free_cache_engine: true
    load_format: dummy_dtensor
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 8192
    max_model_len: null
    max_num_seqs: 1024
    log_prob_micro_batch_size: null
    log_prob_micro_batch_size_per_gpu: 8
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    disable_log_stats: true
    enable_chunked_prefill: true
    do_sample: true
    n: 8
    val_kwargs:
      top_k: -1
      top_p: 0.7
      temperature: 1.0
      n: 4
      do_sample: true
    seed: 42
custom_reward_function:
  path: null
  name: compute_score
algorithm:
  adv_estimator: grpo
trainer:
  balance_batch: true
  total_epochs: 2000
  total_training_steps: 1000
  project_name: hive
  experiment_name: qwen25-math-1.5b-dapo-math-hive-seed42
  logger:
  - console
  val_generations_to_log_to_wandb: 0
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: 50
  resume_mode: disable
  resume_from_path: false
  test_freq: 50
  default_hdfs_dir: null
  remove_previous_ckpt_in_save: false
  del_local_ckpt_after_load: false
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  max_steps: 1000
  val_before_train: false
  val_only: false
  keep_all_ckpts: true
